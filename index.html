<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#03141F">
<meta name="description" content="A simple ocean game: swim the squid with your finger, eat the glowing fish, dodge the shark, the jellyfish and the man o' war.">
<style>[hidden]{display:none !important;}</style>
<title>Squid Snack</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap">
<style>
  :root{
    --abyss:#03141F;
    --deep:#06293E;
    --mid:#0B4A63;
    --foam:#D9F1F7;
    --foam-dim:#8FB8C6;
    --squid:#E8434C;
    --snack:#FFD166;
    --heart:#FF4D6D;
    --heart-off:#274B5C;
  }
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--abyss);
    color:var(--foam);
    font-family:"Nunito",system-ui,-apple-system,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
  }
  #stage{position:fixed;inset:0;touch-action:none;overflow:hidden;background:var(--abyss);}
  #sea{position:absolute;inset:0;width:100%;height:100%;display:block;}

  #hud{
    position:absolute;left:0;right:0;top:0;
    display:flex;align-items:flex-start;justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-right,0px) + 22px) 0 calc(env(safe-area-inset-left,0px) + 22px);
    pointer-events:none;
  }
  #hearts{
    display:grid;
    grid-template-columns:repeat(1,var(--hs,38px));
    gap:calc(var(--hs,38px) * 0.2);
    justify-content:start;
  }
  #hearts.shake{animation:heartshake .36s ease-out;}
  #hearts svg{width:var(--hs,38px);height:var(--hs,38px);filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));}
  #hearts svg.pop{animation:heartpop .55s ease-out;}
  @keyframes heartpop{0%{transform:scale(.5);}45%{transform:scale(1.34);}100%{transform:scale(1);}}
  @keyframes heartshake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}55%{transform:translateX(4px);}80%{transform:translateX(-2px);}}
  #hearts svg .fill{fill:var(--heart);}
  #hearts svg.gone .fill{fill:var(--heart-off);}

  #score{
    display:flex;align-items:center;gap:9px;
    font-family:"Fredoka",system-ui,sans-serif;font-weight:600;
    font-size:34px;line-height:1;font-variant-numeric:tabular-nums;
    color:var(--snack);
    text-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  #score svg{width:36px;height:36px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));}

  .veil{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;text-align:center;
    padding:0 24px;
    background:radial-gradient(120% 90% at 50% 45%, rgba(3,20,31,.55), rgba(3,20,31,.92));
    backdrop-filter:blur(2px);
  }
  .veil[hidden]{display:none !important;}
  .veil h1{
    margin:0;
    font-family:"Fredoka",system-ui,sans-serif;font-weight:700;
    font-size:clamp(42px,11vw,86px);line-height:.95;
    color:var(--squid);
    text-wrap:balance;
    text-shadow:0 6px 24px rgba(232,67,76,.35);
  }
  .veil h2{
    margin:0;
    font-family:"Fredoka",system-ui,sans-serif;font-weight:600;
    font-size:clamp(34px,9vw,64px);line-height:1;
    color:var(--foam);
  }
  .veil p{margin:0;max-width:30ch;font-size:clamp(15px,3.6vw,19px);color:var(--foam-dim);line-height:1.5;}
  .veil .big{
    font-family:"Fredoka",system-ui,sans-serif;font-weight:700;
    font-size:clamp(56px,16vw,120px);line-height:1;color:var(--snack);
    font-variant-numeric:tabular-nums;
  }
  .veil .cue{
    margin-top:6px;
    font-family:"Fredoka",system-ui,sans-serif;font-weight:600;
    font-size:clamp(17px,4.4vw,23px);
    color:var(--foam);
    border:2px solid rgba(217,241,247,.35);
    border-radius:999px;
    padding:11px 26px;
    animation:pulse 1.8s ease-in-out infinite;
  }
  .veil .best{font-size:clamp(14px,3.4vw,17px);color:var(--foam-dim);letter-spacing:.06em;text-transform:uppercase;}
  @keyframes pulse{0%,100%{opacity:.62;transform:scale(1);}50%{opacity:1;transform:scale(1.045);}}
  @media (prefers-reduced-motion:reduce){.veil .cue{animation:none;opacity:1;}}

  #flash{position:absolute;inset:0;background:var(--heart);opacity:0;pointer-events:none;}
  #flash.hit{animation:hitflash .45s ease-out;}
  @keyframes hitflash{0%{opacity:.42;}100%{opacity:0;}}
  #flash.heal{background:#5FD9A6;animation:healflash .5s ease-out;}
  @keyframes healflash{0%{opacity:.26;}100%{opacity:0;}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="sea"></canvas>
  <div id="flash"></div>

  <div id="hud">
    <div id="hearts" aria-label="Lives"></div>
    <div id="score">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2.4 12c3.2-5.4 8.6-6.8 13-4.6l5.1-3.4-1.6 5.4a5 5 0 0 1 0 5.2l1.6 5.4-5.1-3.4C11 18.8 5.6 17.4 2.4 12z" fill="#FFD166"/>
        <circle cx="15.4" cy="10.2" r="1.15" fill="#03141F"/>
      </svg>
      <span id="scoreval">0</span>
    </div>
  </div>

  <div class="veil" id="titleVeil">
    <h1>Squid Snack</h1>
    <p>Drag your finger to swim. Eat the glowing fish. Keep clear of the shark, the jellyfish and the man o' war. Catch a shrimp for an extra heart.</p>
    <div class="cue">Touch to start</div>
  </div>

  <div class="veil" id="overVeil" hidden>
    <h2>Chomp!</h2>
    <p id="overWhy">The shark got you.</p>
    <div class="big" id="finalScore">0</div>
    <p class="best" id="bestLine">Best 0</p>
    <div class="cue">Touch to swim again</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var cv = document.getElementById("sea");
  var ctx = cv.getContext("2d");
  var stage = document.getElementById("stage");
  var heartsEl = document.getElementById("hearts");
  var scoreEl = document.getElementById("scoreval");
  var titleVeil = document.getElementById("titleVeil");
  var overVeil = document.getElementById("overVeil");
  var finalScoreEl = document.getElementById("finalScore");
  var bestLineEl = document.getElementById("bestLine");
  var flashEl = document.getElementById("flash");
  var overWhyEl = document.getElementById("overWhy");

  var W = 1, H = 1, U = 1, DPR = 1;
  var TAU = Math.PI * 2;

  var HEART_SVG =
    '<svg viewBox="0 0 24 24" aria-hidden="true">' +
    '<path class="fill" d="M12 21.2C7.2 18.1 2.6 14.6 2.6 10.3A4.9 4.9 0 0 1 12 8.1a4.9 4.9 0 0 1 9.4 2.2c0 4.3-4.6 7.8-9.4 10.9z"/>' +
    '</svg>';

  var MAX_LIVES = 32, HEARTS_PER_ROW = 16;
  var SQUID_R = 0.042;  /* squid radius as a fraction of the short screen edge */

  /* Difficulty steps, by fish eaten. */
  var NO_WARNING_AT = 50;    /* shark stops showing the warning ring */
  var FAST_SHARK_AT = 100;   /* shark crosses 50% faster */
  var FAST_SHRIMP_AT = 150;  /* shrimp crosses 50% faster again */
  var TWO_SHARKS_AT = 200;   /* a second, independently timed shark joins */
  var MANOWAR_EVERY = 50;    /* a man o' war drifts across on every 50th fish */

  var state = "title";
  var score = 0, lives = 3, best = 0;
  var time = 0;
  var squid, sharks = [], shrimp = null, manowar = null, foods = [], jellies = [], bubbles = [], sparks = [];
  var nextShrimpAt = 10;
  var nextManowarAt = MANOWAR_EVERY;
  var lastHitBy = "shark";

  /* Plush-toy squid: deep red, wide flat fin cap, stubby arms, felt-black face. */
  var YOU = {
    bodyTop: "#E8434C",
    bodyMid: "#C8202C",
    bodyLow: "#8B111F",
    fin: "#B01927",
    finLip: "#D22E3A",
    arm: "#B81C29",
    armInner: "#D2303C",
    belly: "#F7BDB7",
    blush: "#FF8A93",
    ink: "#160A0D"
  };

  var MOW = {
    floatTop: "#BFE6FF",
    floatMid: "#B49BF5",
    floatLow: "#F08BC4",
    crest: "#E4C6FF",
    arm: "rgba(138,120,230,0.85)",
    armCore: "rgba(206,196,255,0.95)",
    spark: "#8CF6FF",
    glow: "124,220,255"
  };

  var JELLY = {
    bellTop: "rgba(214,192,255,0.92)",
    bellMid: "rgba(163,126,238,0.72)",
    bellLow: "rgba(112,76,190,0.50)",
    rim: "rgba(235,222,255,0.9)",
    arm: "rgba(186,154,246,0.85)",
    tentacle: "rgba(170,136,238,0.62)",
    glow: "146,112,226"
  };
  var pointer = { down: false, coast: 0, x: 0, y: 0 };
  var keys = Object.create(null);

  function loadBest() {
    try { return parseInt(localStorage.getItem("squidSnackBest") || "0", 10) || 0; }
    catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem("squidSnackBest", String(v)); } catch (e) {}
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth || window.innerWidth;
    H = stage.clientHeight || window.innerHeight;
    U = Math.min(W, H);
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (squid) { squid.size = U * SQUID_R; }
    for (var k = 0; k < sharks.length; k++) { sharks[k].size = U * 0.082; }
    for (var i = 0; i < foods.length; i++) { foods[i].r = U * 0.024; }
    for (var j = 0; j < jellies.length; j++) { jellies[j].size = jellies[j].sizeF * U * SQUID_R; }
    if (shrimp) { shrimp.size = U * 0.042; }
    if (manowar) { manowar.size = U * 0.132; }
    if (squid) updateHearts(false);
  }

  function rand(a, b) { return a + Math.random() * (b - a); }

  function distToSeg(px, py, x1, y1, x2, y2) {
    var dx = x2 - x1, dy = y2 - y1;
    var L = dx * dx + dy * dy;
    var u = L > 0 ? ((px - x1) * dx + (py - y1) * dy) / L : 0;
    if (u < 0) u = 0; else if (u > 1) u = 1;
    var qx = x1 + u * dx, qy = y1 + u * dy;
    return Math.hypot(px - qx, py - qy);
  }

  function wrapAngle(a) {
    while (a > Math.PI) a -= TAU;
    while (a < -Math.PI) a += TAU;
    return a;
  }

  function makeBubbles() {
    bubbles = [];
    var n = 34;
    for (var i = 0; i < n; i++) {
      bubbles.push({
        x: rand(0, W), y: rand(0, H),
        r: rand(U * 0.004, U * 0.016),
        sp: rand(U * 0.02, U * 0.09),
        drift: rand(-0.5, 0.5),
        a: rand(0.08, 0.3)
      });
    }
  }

  function spawnFood() {
    var r = U * 0.024;
    var x, y, tries = 0, clash;
    do {
      x = rand(r * 3, W - r * 3);
      y = rand(U * 0.16, H - r * 3);
      clash = Math.hypot(x - squid.x, y - squid.y) < U * 0.28;
      for (var k = 0; !clash && k < sharks.length; k++) {
        if (Math.hypot(x - sharks[k].x, y - sharks[k].y) < U * 0.22) clash = true;
      }
      tries++;
    } while (tries < 24 && clash);
    return {
      x: x, y: y, r: r,
      dir: rand(0, TAU),
      turn: rand(-0.7, 0.7),
      sp: rand(U * 0.02, U * 0.06),
      phase: rand(0, TAU),
      born: time
    };
  }

  function foodTarget() {
    return Math.min(9, 4 + Math.floor(score / 10));
  }

  /* Purple squids: one for every perfect square of fish eaten. */
  function jellyTarget() {
    return Math.floor(Math.sqrt(score));
  }

  function spawnJelly() {
    /* Half the player's size up to the same size, never bigger. */
    var sizeF = rand(0.5, 1);
    var size = sizeF * U * SQUID_R;
    var edge = Math.floor(Math.random() * 4);
    var x, y;
    if (edge === 0) { x = rand(size, W - size); y = -size * 2; }
    else if (edge === 1) { x = W + size * 2; y = rand(size, H - size); }
    else if (edge === 2) { x = rand(size, W - size); y = H + size * 2; }
    else { x = -size * 2; y = rand(size, H - size); }

    var toward = Math.atan2(H * 0.5 - y, W * 0.5 - x) + rand(-0.6, 0.6);
    var d = {
      x: x, y: y, size: size, sizeF: sizeF,
      vx: Math.cos(toward) * U * 0.16,
      vy: Math.sin(toward) * U * 0.16,
      tvx: Math.cos(toward) * U * 0.16,
      tvy: Math.sin(toward) * U * 0.16,
      angle: toward, wig: rand(0, TAU), timer: rand(0.5, 1.2),
      pulse: rand(2.6, 3.8), tilt: 0,
      entering: true
    };
    return d;
  }

  function reroll(d) {
    var a = rand(0, TAU);
    var sp;
    if (Math.random() < 0.3) {
      sp = rand(U * 0.5, U * 0.88);
      d.timer = rand(0.22, 0.5);
    } else {
      sp = rand(U * 0.04, U * 0.2);
      d.timer = rand(0.7, 2.1);
    }
    d.tvx = Math.cos(a) * sp;
    d.tvy = Math.sin(a) * sp;
  }

  function updateJellies(dt) {
    while (jellies.length > jellyTarget()) jellies.pop();
    while (jellies.length < jellyTarget()) jellies.push(spawnJelly());

    for (var i = 0; i < jellies.length; i++) {
      var d = jellies[i];
      d.timer -= dt;
      if (d.timer <= 0) { reroll(d); d.entering = false; }

      var ease = Math.min(1, dt * 5.5);
      d.vx += (d.tvx - d.vx) * ease;
      d.vy += (d.tvy - d.vy) * ease;
      d.x += d.vx * dt;
      d.y += d.vy * dt;

      if (!d.entering) {
        var pad = d.size * 1.1;
        if (d.x < pad) { d.x = pad; d.vx = Math.abs(d.vx); d.tvx = Math.abs(d.tvx); }
        if (d.x > W - pad) { d.x = W - pad; d.vx = -Math.abs(d.vx); d.tvx = -Math.abs(d.tvx); }
        var padTop = Math.max(pad, U * 0.13);
        if (d.y < padTop) { d.y = padTop; d.vy = Math.abs(d.vy); d.tvy = Math.abs(d.tvy); }
        if (d.y > H - pad) { d.y = H - pad; d.vy = -Math.abs(d.vy); d.tvy = -Math.abs(d.tvy); }
      } else if (d.x > d.size && d.x < W - d.size && d.y > d.size && d.y < H - d.size) {
        d.entering = false;
      }

      var sp2 = Math.hypot(d.vx, d.vy);
      var wantTilt = Math.max(-0.55, Math.min(0.55, d.vx / (U * 0.55)));
      d.tilt += (wantTilt - d.tilt) * Math.min(1, dt * 3.5);
      d.wig += dt * (d.pulse + sp2 / (U * 0.14));

      if (squid.inv <= 0 && !d.entering &&
          Math.hypot(d.x - squid.x, d.y - squid.y) < d.size * 0.8 + squid.size * 0.78) {
        burst(d.x, d.y, "186,154,246", 16);
        var flee = Math.atan2(d.y - squid.y, d.x - squid.x);
        d.tvx = Math.cos(flee) * U * 0.8;
        d.tvy = Math.sin(flee) * U * 0.8;
        d.vx = d.tvx; d.vy = d.tvy;
        d.timer = 0.6;
        hitHeart(d.x, d.y, "jelly");
        if (lives <= 0) return;
      }
    }
  }

  /* One shrimp drifts slowly across every 10 fish. Catching it refills a heart. */
  function spawnShrimp() {
    var size = U * 0.042;
    var m = size * 2.4;
    var edge = Math.floor(Math.random() * 4);
    var base = [Math.PI / 2, Math.PI, -Math.PI / 2, 0][edge];
    var roll = Math.random();
    var diag = roll < 0.5 ? 0 : (roll < 0.75 ? -1 : 1);
    var angle = base + diag * (Math.PI / 4);
    var dx = Math.cos(angle), dy = Math.sin(angle);
    var ex, ey;

    if (edge === 0 || edge === 2) {
      ey = edge === 0 ? 0 : H;
      if (dx > 0.1) ex = rand(m, Math.max(m + 1, W * 0.5));
      else if (dx < -0.1) ex = rand(Math.min(W - m - 1, W * 0.5), W - m);
      else ex = rand(m, W - m);
    } else {
      ex = edge === 1 ? W : 0;
      if (dy > 0.1) ey = rand(m, Math.max(m + 1, H * 0.5));
      else if (dy < -0.1) ey = rand(Math.min(H - m - 1, H * 0.5), H - m);
      else ey = rand(m, H - m);
    }

    shrimp = {
      x: ex - dx * size * 2.6,
      y: ey - dy * size * 2.6,
      angle: angle,
      size: size,
      speed: U * 0.1725 * (score >= FAST_SHRIMP_AT ? 1.5 : 1),
      wig: 0,
      px: 0, py: 0
    };
  }

  function updateShrimp(dt) {
    if (!shrimp) return;
    var s = shrimp.size;
    shrimp.x += Math.cos(shrimp.angle) * shrimp.speed * dt;
    shrimp.y += Math.sin(shrimp.angle) * shrimp.speed * dt;
    shrimp.wig += dt * 4.2;

    var bob = Math.sin(time * 2.6) * s * 0.22;
    shrimp.px = shrimp.x - Math.sin(shrimp.angle) * bob;
    shrimp.py = shrimp.y + Math.cos(shrimp.angle) * bob;

    var out = s * 4;
    if (shrimp.x < -out || shrimp.x > W + out || shrimp.y < -out || shrimp.y > H + out) {
      shrimp = null;
      return;
    }

    if (Math.hypot(shrimp.px - squid.x, shrimp.py - squid.y) < s * 0.95 + squid.size * 0.8) {
      burst(shrimp.px, shrimp.py, "255,150,120", 20);
      shrimp = null;
      if (lives < MAX_LIVES) {
        lives++;
        updateHearts(true);
        flashEl.classList.remove("hit", "heal");
        void flashEl.offsetWidth;
        flashEl.classList.add("heal");
      }
    }
  }

  /* A big man o' war drifts straight across, trailing long stinging tentacles. */
  function spawnManowar() {
    var size = U * 0.132;
    var fromLeft = Math.random() < 0.5;
    var arms = [];
    var N = 5;
    for (var i = 0; i < N; i++) {
      arms.push({
        offF: ((i / (N - 1)) - 0.5) * 3.4,
        lenF: rand(3.8, 5.4),
        ph: i * 0.8,
        spark: Math.random(),
        sparkSp: rand(0.22, 0.42),
        pts: []
      });
    }
    manowar = {
      size: size,
      dir: fromLeft ? 1 : -1,
      x: fromLeft ? -size * 2.4 : W + size * 2.4,
      y: rand(U * 0.17, Math.max(U * 0.2, H * 0.3)),
      speed: U * 0.075,
      wave: rand(0.8, 1.1),
      bob: 0,
      surge: 0,
      surgeIn: rand(0.8, 1.8),
      arms: arms
    };
  }

  function manowarShape() {
    var m = manowar;
    var SEG = 22;
    for (var i = 0; i < m.arms.length; i++) {
      var a = m.arms[i];
      var bx = m.x + a.offF * m.size;
      var by = m.y + m.size * 0.42;
      var len = a.lenF * m.size;
      a.pts.length = 0;
      for (var k = 0; k <= SEG; k++) {
        var u = k / SEG;
        var wob = Math.sin(time * m.wave * 1.7 + a.ph + u * 4.4) * m.size * 0.24 * u;
        var trail = -m.dir * u * u * m.size * 0.6;
        a.pts.push(bx + wob + trail, by + u * len);
      }
    }
  }

  function updateManowar(dt) {
    if (!manowar) return;
    var m = manowar;

    m.x += m.dir * m.speed * dt;
    m.bob = Math.sin(time * 1.3) * m.size * 0.09;

    m.surgeIn -= dt;
    if (m.surgeIn <= 0) { m.surge = 1; m.surgeIn = rand(1.3, 2.4); }
    if (m.surge > 0) m.surge = Math.max(0, m.surge - dt * 1.7);

    for (var i = 0; i < m.arms.length; i++) {
      var a = m.arms[i];
      a.spark += dt * a.sparkSp;
      if (a.spark > 1.25) a.spark -= 1.5;
    }

    manowarShape();

    var out = m.size * 8;
    if (m.x < -out || m.x > W + out) { manowar = null; return; }

    if (squid.inv > 0) return;

    var ex = (squid.x - m.x) / (m.size * 1.85 + squid.size * 0.5);
    var ey = (squid.y - (m.y + m.bob)) / (m.size * 0.85 + squid.size * 0.5);
    if (ex * ex + ey * ey < 1) {
      burst(squid.x, squid.y, MOW.glow, 20);
      hitHeart(m.x, m.y + m.bob, "manowar");
      return;
    }

    var reach = m.size * 0.07 + squid.size * 0.55;
    for (var j = 0; j < m.arms.length; j++) {
      var p = m.arms[j].pts;
      for (var k = 0; k + 3 < p.length; k += 2) {
        if (distToSeg(squid.x, squid.y, p[k], p[k + 1], p[k + 2], p[k + 3]) < reach) {
          burst(squid.x, squid.y, MOW.glow, 20);
          hitHeart(p[k], p[k + 1], "manowar");
          return;
        }
      }
    }
  }

  function reset() {
    time = 0;
    score = 0;
    lives = 3;
    squid = {
      x: W * 0.5, y: H * 0.62,
      vx: 0, vy: 0,
      angle: -Math.PI / 2,
      size: U * SQUID_R,
      inv: 1.2,
      wig: 0
    };
    sharks = [makeShark(1.8)];
    foods = [];
    jellies = [];
    sparks = [];
    shrimp = null;
    manowar = null;
    nextShrimpAt = 10;
    nextManowarAt = MANOWAR_EVERY;
    for (var i = 0; i < foodTarget(); i++) foods.push(spawnFood());
    makeBubbles();
    pointer.down = false;
    pointer.coast = 0;
    pointer.x = squid.x;
    pointer.y = squid.y;
    paintHud();
  }

  /* Hearts wrap at 16 per row and shrink so a full 32 still fits the width. */
  function heartSize() {
    var perRow = Math.min(Math.max(lives, 1), HEARTS_PER_ROW);
    var avail = Math.max(140, W - Math.max(150, W * 0.22));
    return Math.max(11, Math.min(38, (avail / perRow) / 1.2));
  }

  function updateHearts(popLast) {
    var cols = Math.min(Math.max(lives, 1), HEARTS_PER_ROW);
    heartsEl.style.setProperty("--hs", heartSize().toFixed(1) + "px");
    heartsEl.style.gridTemplateColumns = "repeat(" + cols + ", var(--hs))";

    var html = "";
    for (var i = 0; i < lives; i++) html += HEART_SVG;
    heartsEl.innerHTML = html;

    if (popLast && lives > 0) {
      var got = heartsEl.children[lives - 1];
      if (got) got.classList.add("pop");
    }
  }

  function paintHud() {
    updateHearts(false);
    scoreEl.textContent = String(score);
  }

  /* ---------- input ---------- */

  function pointAt(e) {
    var rect = cv.getBoundingClientRect();
    pointer.x = e.clientX - rect.left;
    pointer.y = e.clientY - rect.top;
  }

  stage.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (state === "title") { startGame(); return; }
    if (state === "over") { startGame(); return; }
    pointer.down = true;
    pointer.coast = 0;
    pointAt(e);
    if (stage.setPointerCapture) { try { stage.setPointerCapture(e.pointerId); } catch (err) {} }
  }, { passive: false });

  stage.addEventListener("pointermove", function (e) {
    if (!pointer.down) return;
    e.preventDefault();
    pointAt(e);
  }, { passive: false });

  function release() {
    if (pointer.down) pointer.coast = 1.6;
    pointer.down = false;
  }
  stage.addEventListener("pointerup", release);
  stage.addEventListener("pointercancel", release);
  stage.addEventListener("pointerleave", release);

  stage.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  stage.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  window.addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "Enter") {
      if (state !== "playing") { startGame(); e.preventDefault(); return; }
    }
    keys[e.key] = true;
    if (e.key.indexOf("Arrow") === 0) e.preventDefault();
  });
  window.addEventListener("keyup", function (e) { keys[e.key] = false; });

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 260); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { pointer.down = false; pointer.coast = 0; }
    last = 0;
  });

  function startGame() {
    resize();
    reset();
    state = "playing";
    titleVeil.hidden = true;
    overVeil.hidden = true;
  }

  function endGame() {
    state = "over";
    pointer.down = false;
    pointer.coast = 0;
    if (score > best) { best = score; saveBest(best); }
    overWhyEl.textContent =
      lastHitBy === "jelly" ? "A jellyfish got you." :
      lastHitBy === "manowar" ? "The man o' war got you." :
      "The shark got you.";
    finalScoreEl.textContent = String(score);
    bestLineEl.textContent = "Best " + best;
    overVeil.hidden = false;
  }

  /* ---------- update ---------- */

  function hitHeart(sx, sy, cause) {
    lives--;
    lastHitBy = cause;
    updateHearts(false);
    heartsEl.classList.remove("shake");
    void heartsEl.offsetWidth;
    heartsEl.classList.add("shake");
    squid.inv = 1.7;
    var away = Math.atan2(squid.y - sy, squid.x - sx);
    squid.vx = Math.cos(away) * U * 0.62;
    squid.vy = Math.sin(away) * U * 0.62;
    flashEl.classList.remove("hit", "heal");
    void flashEl.offsetWidth;
    flashEl.classList.add("hit");
    if (lives <= 0) endGame();
  }

  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = rand(0, TAU), s = rand(U * 0.08, U * 0.3);
      sparks.push({
        x: x, y: y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: rand(0.35, 0.7), age: 0,
        r: rand(U * 0.004, U * 0.011),
        c: color
      });
    }
  }

  function nextGap() {
    var lo = Math.max(0.7, 2.2 - score * 0.02);
    var hi = Math.max(lo + 0.9, 4.2 - score * 0.03);
    return rand(lo, hi);
  }

  function makeShark(delay) {
    return {
      x: -99999, y: -99999,
      angle: Math.PI / 2,
      size: U * 0.082,
      phase: "wait",
      timer: delay,
      speed: 0,
      wag: rand(0, TAU),
      bob: 0,
      lastEdge: -1
    };
  }

  function sharkCount() {
    return score >= TWO_SHARKS_AT ? 2 : 1;
  }

  /* Shark surfaces its nose at a random edge, holds 1-3s, then runs
     straight or diagonally all the way across and leaves. Each shark
     keeps its own timers, so two of them never move together. */
  function beginPeek(shark) {
    var s = shark.size;
    var m = s * 1.7;
    var edge = Math.floor(Math.random() * 4);
    if (edge === shark.lastEdge) edge = (edge + 1 + Math.floor(Math.random() * 3)) % 4;
    shark.lastEdge = edge;
    var base = [Math.PI / 2, Math.PI, -Math.PI / 2, 0][edge];
    var roll = Math.random();
    var diag = roll < 0.45 ? 0 : (roll < 0.725 ? -1 : 1);
    var angle = base + diag * (Math.PI / 4);
    var dx = Math.cos(angle), dy = Math.sin(angle);
    var ex, ey;

    if (edge === 0 || edge === 2) {
      ey = edge === 0 ? 0 : H;
      if (dx > 0.1) ex = rand(m, Math.max(m + 1, W * 0.52));
      else if (dx < -0.1) ex = rand(Math.min(W - m - 1, W * 0.48), W - m);
      else ex = rand(m, W - m);
    } else {
      ex = edge === 1 ? W : 0;
      if (dy > 0.1) ey = rand(m, Math.max(m + 1, H * 0.52));
      else if (dy < -0.1) ey = rand(Math.min(H - m - 1, H * 0.48), H - m);
      else ey = rand(m, H - m);
    }

    var back = s * 1.32 - s * 0.5;
    shark.angle = angle;
    shark.x = ex - dx * back;
    shark.y = ey - dy * back;
    shark.phase = "peek";
    shark.timer = rand(1, 3);
    shark.bob = 0;
  }

  function update(dt) {
    time += dt;

    for (var b = 0; b < bubbles.length; b++) {
      var bu = bubbles[b];
      bu.y -= bu.sp * dt;
      bu.x += Math.sin(time * 1.4 + bu.y * 0.02) * bu.drift;
      if (bu.y < -bu.r * 2) { bu.y = H + bu.r * 2; bu.x = rand(0, W); }
    }

    for (var s = sparks.length - 1; s >= 0; s--) {
      var sp = sparks[s];
      sp.age += dt;
      if (sp.age >= sp.life) { sparks.splice(s, 1); continue; }
      sp.x += sp.vx * dt; sp.y += sp.vy * dt;
      sp.vx *= 0.94; sp.vy *= 0.94;
    }

    if (state !== "playing") return;

    /* --- squid --- */
    var accel = U * 5.2;
    var maxSpeed = U * 0.95;
    var ax = 0, ay = 0;

    if (pointer.coast > 0) pointer.coast -= dt;
    if (pointer.down || pointer.coast > 0) {
      var dx = pointer.x - squid.x, dy = pointer.y - squid.y;
      var d = Math.hypot(dx, dy);
      if (!pointer.down && d < U * 0.035) pointer.coast = 0;
      if (d > 1.5) {
        var pull = Math.min(d / (U * 0.10), 1);
        ax = (dx / d) * accel * pull;
        ay = (dy / d) * accel * pull;
      }
    }
    var kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.a) kx -= 1;
    if (keys.ArrowRight || keys.d) kx += 1;
    if (keys.ArrowUp || keys.w) ky -= 1;
    if (keys.ArrowDown || keys.s) ky += 1;
    if (kx || ky) {
      var kl = Math.hypot(kx, ky);
      ax = (kx / kl) * accel;
      ay = (ky / kl) * accel;
    }

    squid.vx += ax * dt;
    squid.vy += ay * dt;
    var damp = Math.pow(0.0016, dt);
    squid.vx *= damp;
    squid.vy *= damp;

    var sv = Math.hypot(squid.vx, squid.vy);
    if (sv > maxSpeed) { squid.vx = squid.vx / sv * maxSpeed; squid.vy = squid.vy / sv * maxSpeed; sv = maxSpeed; }

    squid.x += squid.vx * dt;
    squid.y += squid.vy * dt;

    var pad = squid.size * 0.9;
    if (squid.x < pad) { squid.x = pad; squid.vx *= -0.35; }
    if (squid.x > W - pad) { squid.x = W - pad; squid.vx *= -0.35; }
    if (squid.y < pad) { squid.y = pad; squid.vy *= -0.35; }
    if (squid.y > H - pad) { squid.y = H - pad; squid.vy *= -0.35; }

    if (sv > U * 0.06) {
      var want = Math.atan2(squid.vy, squid.vx);
      squid.angle += wrapAngle(want - squid.angle) * Math.min(1, dt * 11);
    }
    squid.wig += dt * (3 + sv / (U * 0.12));
    if (squid.inv > 0) squid.inv -= dt;

    /* --- sharks --- */
    var chargeSpeed = Math.min(U * 1.35, U * (0.45 + score * 0.012));
    if (score >= FAST_SHARK_AT) chargeSpeed *= 1.5;

    while (sharks.length < sharkCount()) sharks.push(makeShark(rand(0.4, 3.6)));
    while (sharks.length > sharkCount()) sharks.pop();

    for (var k = 0; k < sharks.length; k++) {
      var sk = sharks[k];
      if (sk.phase === "wait") {
        sk.timer -= dt;
        if (sk.timer <= 0) beginPeek(sk);
      } else if (sk.phase === "peek") {
        sk.timer -= dt;
        sk.bob = Math.sin(time * 5.5 + k * 1.9) * sk.size * 0.07;
        if (sk.timer <= 0) {
          sk.phase = "charge";
          sk.speed = chargeSpeed;
        }
      } else {
        sk.bob = 0;
        sk.x += Math.cos(sk.angle) * sk.speed * dt;
        sk.y += Math.sin(sk.angle) * sk.speed * dt;
        var out = sk.size * 3;
        if (sk.x < -out || sk.x > W + out || sk.y < -out || sk.y > H + out) {
          sk.phase = "wait";
          sk.timer = nextGap();
          sk.x = -99999;
          sk.y = -99999;
        }
      }
      sk.wag += dt * (sk.phase === "charge" ? 13 : 3.6);

      if (squid.inv <= 0 && sk.phase !== "wait") {
        var noseX = sk.x + Math.cos(sk.angle) * sk.size * 0.75;
        var noseY = sk.y + Math.sin(sk.angle) * sk.size * 0.75;
        if (Math.hypot(noseX - squid.x, noseY - squid.y) < sk.size * 0.62 + squid.size * 0.7) {
          burst(squid.x, squid.y, "232,67,76", 16);
          hitHeart(noseX, noseY, "shark");
          if (lives <= 0) return;
        }
      }
    }

    /* --- food --- */
    for (var f = foods.length - 1; f >= 0; f--) {
      var fo = foods[f];
      fo.dir += fo.turn * dt;
      fo.x += Math.cos(fo.dir) * fo.sp * dt;
      fo.y += Math.sin(fo.dir) * fo.sp * dt + Math.sin(time * 2.4 + fo.phase) * U * 0.02 * dt;
      var fp = fo.r * 2;
      if (fo.x < fp || fo.x > W - fp) { fo.dir = Math.PI - fo.dir; fo.x = Math.max(fp, Math.min(W - fp, fo.x)); }
      if (fo.y < U * 0.14 || fo.y > H - fp) { fo.dir = -fo.dir; fo.y = Math.max(U * 0.14, Math.min(H - fp, fo.y)); }

      if (Math.hypot(fo.x - squid.x, fo.y - squid.y) < fo.r + squid.size * 0.95) {
        burst(fo.x, fo.y, "255,209,102", 12);
        foods.splice(f, 1);
        score++;
        scoreEl.textContent = String(score);
        if (score >= nextShrimpAt) {
          nextShrimpAt += 10;
          if (!shrimp) spawnShrimp();
        }
        if (score >= nextManowarAt) {
          nextManowarAt += MANOWAR_EVERY;
          if (!manowar) spawnManowar();
        }
      }
    }
    while (foods.length < foodTarget()) foods.push(spawnFood());

    updateShrimp(dt);
    updateManowar(dt);
    if (lives <= 0) return;
    updateJellies(dt);
  }

  /* ---------- draw ---------- */

  function drawBackground() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0E5C78");
    g.addColorStop(0.42, "#084A65");
    g.addColorStop(1, "#03141F");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < 4; i++) {
      var baseX = W * (0.12 + i * 0.26);
      var sway = Math.sin(time * 0.24 + i * 1.7) * W * 0.05;
      var w = U * (0.12 + i * 0.03);
      ctx.beginPath();
      ctx.moveTo(baseX + sway - w * 0.4, -10);
      ctx.lineTo(baseX + sway + w * 0.4, -10);
      ctx.lineTo(baseX + sway * 2.1 + w * 1.5, H * 0.95);
      ctx.lineTo(baseX + sway * 2.1 - w * 1.5, H * 0.95);
      ctx.closePath();
      var rg = ctx.createLinearGradient(0, 0, 0, H * 0.95);
      rg.addColorStop(0, "rgba(170,235,255,0.085)");
      rg.addColorStop(1, "rgba(170,235,255,0)");
      ctx.fillStyle = rg;
      ctx.fill();
    }
    ctx.restore();

    ctx.save();
    for (var b = 0; b < bubbles.length; b++) {
      var bu = bubbles[b];
      ctx.beginPath();
      ctx.arc(bu.x, bu.y, bu.r, 0, TAU);
      ctx.strokeStyle = "rgba(210,244,255," + bu.a + ")";
      ctx.lineWidth = Math.max(1, bu.r * 0.28);
      ctx.stroke();
    }
    ctx.restore();

    var vg = ctx.createRadialGradient(W / 2, H * 0.45, U * 0.2, W / 2, H * 0.5, Math.max(W, H) * 0.78);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.42)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  function drawFood(fo) {
    var wob = Math.sin(time * 6 + fo.phase);
    ctx.save();
    ctx.translate(fo.x, fo.y);
    ctx.rotate(fo.dir + Math.PI);

    var gg = ctx.createRadialGradient(0, 0, 0, 0, 0, fo.r * 3.6);
    gg.addColorStop(0, "rgba(255,209,102,0.42)");
    gg.addColorStop(1, "rgba(255,209,102,0)");
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(0, 0, fo.r * 3.6, 0, TAU);
    ctx.fill();

    ctx.fillStyle = "#FFD166";
    ctx.beginPath();
    ctx.ellipse(0, 0, fo.r, fo.r * 0.64, 0, 0, TAU);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(fo.r * 0.72, 0);
    ctx.lineTo(fo.r * 1.75, -fo.r * 0.62 + wob * fo.r * 0.24);
    ctx.lineTo(fo.r * 1.75, fo.r * 0.62 + wob * fo.r * 0.24);
    ctx.closePath();
    ctx.fillStyle = "#F4A261";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(-fo.r * 0.48, -fo.r * 0.14, fo.r * 0.2, 0, TAU);
    ctx.fillStyle = "#03141F";
    ctx.fill();
    ctx.restore();
  }

  function heartPath(r) {
    ctx.beginPath();
    ctx.moveTo(0, r * 0.92);
    ctx.bezierCurveTo(-r * 1.35, -r * 0.12, -r * 0.72, -r * 1.16, 0, -r * 0.42);
    ctx.bezierCurveTo(r * 0.72, -r * 1.16, r * 1.35, -r * 0.12, 0, r * 0.92);
    ctx.closePath();
  }

  function drawShrimp() {
    var s = shrimp.size;
    var w = shrimp.wig;

    ctx.save();
    var gg = ctx.createRadialGradient(shrimp.px, shrimp.py, 0, shrimp.px, shrimp.py, s * 2.8);
    gg.addColorStop(0, "rgba(255,146,110,0.30)");
    gg.addColorStop(1, "rgba(255,146,110,0)");
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(shrimp.px, shrimp.py, s * 2.8, 0, TAU);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(shrimp.px, shrimp.py);
    ctx.rotate(shrimp.angle);
    ctx.lineCap = "round";

    ctx.strokeStyle = "rgba(255,206,188,0.8)";
    ctx.lineWidth = Math.max(1, s * 0.07);
    for (var a = 0; a < 2; a++) {
      var sg = a === 0 ? -1 : 1;
      ctx.beginPath();
      ctx.moveTo(s * 0.86, sg * s * 0.1);
      ctx.quadraticCurveTo(
        s * 0.1, sg * s * (0.75 + Math.sin(w + a) * 0.12),
        -s * 1.5, sg * s * (1.0 + Math.sin(w * 1.3 + a) * 0.2)
      );
      ctx.stroke();
    }

    ctx.strokeStyle = "#F4805B";
    ctx.lineWidth = Math.max(1, s * 0.08);
    for (var l = 0; l < 5; l++) {
      var lx = s * (0.55 - l * 0.32);
      var sw = Math.sin(w * 2 + l * 0.8) * s * 0.12;
      ctx.beginPath();
      ctx.moveTo(lx, s * 0.26);
      ctx.lineTo(lx - s * 0.1 + sw, s * 0.66);
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.moveTo(-s * 1.02, -s * 0.12);
    ctx.lineTo(-s * 1.62, -s * 0.62);
    ctx.lineTo(-s * 1.5, s * 0.02);
    ctx.lineTo(-s * 1.62, s * 0.6);
    ctx.closePath();
    ctx.fillStyle = "#F4805B";
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(s * 1.05, -s * 0.02);
    ctx.bezierCurveTo(s * 0.72, -s * 0.62, -s * 0.2, -s * 0.72, -s * 0.82, -s * 0.34);
    ctx.bezierCurveTo(-s * 1.12, -s * 0.14, -s * 1.08, s * 0.1, -s * 0.9, s * 0.2);
    ctx.bezierCurveTo(-s * 0.3, s * 0.52, s * 0.62, s * 0.44, s * 1.05, -s * 0.02);
    ctx.closePath();
    var bg = ctx.createLinearGradient(0, -s * 0.7, 0, s * 0.6);
    bg.addColorStop(0, "#FFC2A5");
    bg.addColorStop(0.5, "#FF9772");
    bg.addColorStop(1, "#E9633E");
    ctx.fillStyle = bg;
    ctx.fill();

    ctx.strokeStyle = "rgba(200,78,48,0.42)";
    ctx.lineWidth = Math.max(1, s * 0.055);
    for (var g = 0; g < 3; g++) {
      var gx = -s * (0.05 + g * 0.3);
      ctx.beginPath();
      ctx.moveTo(gx, -s * 0.48 + g * s * 0.06);
      ctx.quadraticCurveTo(gx - s * 0.08, 0, gx + s * 0.02, s * 0.32 - g * s * 0.04);
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.moveTo(s * 1.0, -s * 0.04);
    ctx.lineTo(s * 1.52, -s * 0.3);
    ctx.lineTo(s * 0.98, s * 0.12);
    ctx.closePath();
    ctx.fillStyle = "#FFB894";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(s * 0.66, -s * 0.2, s * 0.13, 0, TAU);
    ctx.fillStyle = "#2A1712";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s * 0.69, -s * 0.24, s * 0.045, 0, TAU);
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.fill();

    ctx.restore();

    var lift = Math.sin(time * 3) * s * 0.14;
    ctx.save();
    ctx.translate(shrimp.px, shrimp.py - s * 2.05 + lift);
    ctx.globalAlpha = lives < MAX_LIVES ? 0.95 : 0.35;
    heartPath(s * 0.42);
    ctx.fillStyle = "#FF4D6D";
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawManowar() {
    var m = manowar;
    var r = m.size;
    var cy = m.y + m.bob;
    var surge = m.surge;

    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    for (var i = 0; i < m.arms.length; i++) {
      var a = m.arms[i];
      var p = a.pts;
      var SEG = (p.length / 2) - 1;

      ctx.beginPath();
      ctx.moveTo(p[0], p[1]);
      for (var k = 2; k + 1 < p.length; k += 2) ctx.lineTo(p[k], p[k + 1]);

      ctx.lineWidth = r * 0.24;
      ctx.strokeStyle = "rgba(" + MOW.glow + "," + (0.08 + surge * 0.12).toFixed(3) + ")";
      ctx.stroke();

      ctx.lineWidth = r * 0.12;
      ctx.strokeStyle = MOW.arm;
      ctx.stroke();

      ctx.lineWidth = r * 0.045;
      ctx.strokeStyle = MOW.armCore;
      ctx.stroke();

      var centre = a.spark * SEG;
      var lo = Math.max(0, Math.floor(centre - 3.2));
      var hi = Math.min(SEG, Math.ceil(centre + 0.8));
      if (hi > lo) {
        ctx.beginPath();
        ctx.moveTo(p[lo * 2], p[lo * 2 + 1]);
        for (var q = lo + 1; q <= hi; q++) ctx.lineTo(p[q * 2], p[q * 2 + 1]);
        ctx.shadowColor = MOW.spark;
        ctx.shadowBlur = r * (0.5 + surge * 0.7);
        ctx.lineWidth = r * 0.085;
        ctx.strokeStyle = MOW.spark;
        ctx.stroke();
        ctx.lineWidth = r * 0.03;
        ctx.strokeStyle = "rgba(255,255,255,0.95)";
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      if (surge > 0.3) {
        ctx.strokeStyle = "rgba(255,255,255," + (surge * 0.75).toFixed(3) + ")";
        ctx.lineWidth = r * 0.022;
        for (var z = 4; z < SEG; z += 5) {
          var zx = p[z * 2], zy = p[z * 2 + 1];
          var w2 = r * 0.13 * surge;
          ctx.beginPath();
          ctx.moveTo(zx - w2, zy - w2 * 0.45);
          ctx.lineTo(zx + w2 * 0.55, zy + w2 * 0.15);
          ctx.lineTo(zx - w2 * 0.35, zy + w2 * 0.75);
          ctx.stroke();
        }
      }

      ctx.beginPath();
      ctx.arc(p[p.length - 2], p[p.length - 1], r * 0.055, 0, TAU);
      ctx.fillStyle = MOW.spark;
      ctx.fill();
    }

    var halo = ctx.createRadialGradient(m.x, cy, 0, m.x, cy, r * 2.6);
    halo.addColorStop(0, "rgba(" + MOW.glow + "," + (0.14 + surge * 0.16).toFixed(3) + ")");
    halo.addColorStop(1, "rgba(" + MOW.glow + ",0)");
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(m.x, cy, r * 2.6, 0, TAU);
    ctx.fill();

    ctx.translate(m.x, cy);
    var w = r * 1.85, h = r * 0.62;

    ctx.beginPath();
    ctx.moveTo(-w * 0.6, -h * 0.55);
    ctx.quadraticCurveTo(0, -h * 2.25, w * 0.6, -h * 0.55);
    ctx.quadraticCurveTo(0, -h * 1.0, -w * 0.6, -h * 0.55);
    ctx.closePath();
    ctx.fillStyle = MOW.crest;
    ctx.globalAlpha = 0.85;
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.beginPath();
    ctx.moveTo(-w, 0);
    ctx.bezierCurveTo(-w * 0.72, -h * 1.1, w * 0.72, -h * 1.1, w, 0);
    ctx.bezierCurveTo(w * 0.68, h * 0.9, -w * 0.68, h * 0.9, -w, 0);
    ctx.closePath();
    var fg = ctx.createLinearGradient(0, -h * 1.1, 0, h * 0.9);
    fg.addColorStop(0, MOW.floatTop);
    fg.addColorStop(0.5, MOW.floatMid);
    fg.addColorStop(1, MOW.floatLow);
    ctx.fillStyle = fg;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-w * 0.9, -h * 0.18);
    ctx.bezierCurveTo(-w * 0.66, -h * 0.95, w * 0.66, -h * 0.95, w * 0.9, -h * 0.18);
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = r * 0.045;
    ctx.stroke();

    ctx.globalAlpha = 0.3 + surge * 0.4;
    ctx.strokeStyle = MOW.spark;
    ctx.lineWidth = r * 0.03;
    for (var c = 0; c < 3; c++) {
      var cx = (c - 1) * w * 0.44;
      ctx.beginPath();
      ctx.moveTo(cx, h * 0.2);
      ctx.lineTo(cx + r * 0.05, h * 0.55);
      ctx.lineTo(cx - r * 0.04, h * 0.8);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  function drawShark(shark) {
    var s = shark.size;
    ctx.save();
    ctx.translate(shark.x, shark.y);
    ctx.rotate(shark.angle);
    if (shark.bob) ctx.translate(0, shark.bob);

    if (shark.phase === "peek" && score < NO_WARNING_AT) {
      var pulse = 0.5 + 0.5 * Math.sin(time * 7);
      ctx.save();
      ctx.translate(s * 1.3, 0);
      var wg = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 2.2);
      wg.addColorStop(0, "rgba(255,77,109,0.30)");
      wg.addColorStop(1, "rgba(255,77,109,0)");
      ctx.fillStyle = wg;
      ctx.beginPath();
      ctx.arc(0, 0, s * 2.2, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 0, s * (0.7 + pulse * 0.85), 0, TAU);
      ctx.strokeStyle = "rgba(255,109,140," + (0.55 * (1 - pulse)) + ")";
      ctx.lineWidth = Math.max(2, s * 0.09);
      ctx.stroke();
      ctx.restore();
    }

    var tail = Math.sin(shark.wag) * 0.34;

    ctx.save();
    ctx.translate(-s * 1.05, 0);
    ctx.rotate(tail);
    ctx.beginPath();
    ctx.moveTo(s * 0.18, 0);
    ctx.lineTo(-s * 0.55, -s * 0.85);
    ctx.lineTo(-s * 0.22, 0);
    ctx.lineTo(-s * 0.5, s * 0.6);
    ctx.closePath();
    ctx.fillStyle = "#6E8998";
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.moveTo(-s * 0.05, -s * 0.36);
    ctx.lineTo(-s * 0.18, -s * 1.02);
    ctx.lineTo(-s * 0.52, -s * 0.28);
    ctx.closePath();
    ctx.fillStyle = "#6E8998";
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(s * 0.1, s * 0.3);
    ctx.lineTo(-s * 0.3, s * 0.92);
    ctx.lineTo(-s * 0.36, s * 0.24);
    ctx.closePath();
    ctx.fillStyle = "#5E7A89";
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(s * 1.32, 0);
    ctx.bezierCurveTo(s * 0.7, -s * 0.56, -s * 0.2, -s * 0.6, -s * 1.02, -s * 0.2);
    ctx.bezierCurveTo(-s * 0.6, 0, -s * 0.6, 0, -s * 1.02, s * 0.2);
    ctx.bezierCurveTo(-s * 0.2, s * 0.6, s * 0.7, s * 0.5, s * 1.32, 0);
    ctx.closePath();
    var bg = ctx.createLinearGradient(0, -s * 0.6, 0, s * 0.6);
    bg.addColorStop(0, "#9FB6C4");
    bg.addColorStop(0.6, "#7E97A6");
    bg.addColorStop(1, "#DCE8EE");
    ctx.fillStyle = bg;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(s * 1.24, s * 0.06);
    ctx.quadraticCurveTo(s * 0.72, s * 0.34, s * 0.3, s * 0.22);
    ctx.strokeStyle = "rgba(20,40,52,0.75)";
    ctx.lineWidth = Math.max(1.4, s * 0.06);
    ctx.lineCap = "round";
    ctx.stroke();

    ctx.strokeStyle = "rgba(40,66,80,0.45)";
    ctx.lineWidth = Math.max(1, s * 0.045);
    for (var g = 0; g < 3; g++) {
      var gx = s * (0.42 - g * 0.15);
      ctx.beginPath();
      ctx.moveTo(gx, -s * 0.24);
      ctx.lineTo(gx - s * 0.05, s * 0.06);
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(s * 0.82, -s * 0.2, s * 0.1, 0, TAU);
    ctx.fillStyle = "#12252E";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s * 0.85, -s * 0.23, s * 0.035, 0, TAU);
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.fill();

    ctx.restore();
  }

  function drawSquid() {
    var flicker = squid.inv > 0 ? (Math.sin(time * 26) > -0.1 ? 1 : 0.24) : 1;
    var speed = Math.hypot(squid.vx, squid.vy) / (U * 0.95);
    drawSquidShape(squid.x, squid.y, squid.angle, squid.size, flicker, squid.wig, speed, YOU);
  }

  function drawJellies() {
    for (var i = 0; i < jellies.length; i++) drawJelly(jellies[i]);
  }

  function drawJelly(d) {
    var r = d.size;
    var pulse = Math.sin(d.wig);
    var bw = r * (1 + pulse * 0.17);
    var bh = r * (0.92 - pulse * 0.22);

    ctx.save();
    var gg = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, r * 2.6);
    gg.addColorStop(0, "rgba(" + JELLY.glow + ",0.24)");
    gg.addColorStop(1, "rgba(" + JELLY.glow + ",0)");
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(d.x, d.y, r * 2.6, 0, TAU);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.tilt);
    ctx.lineCap = "round";

    var dragX = -(d.vx / (U * 0.9)) * r * 0.85;
    var dragY = -(d.vy / (U * 0.9)) * r * 0.5;

    ctx.strokeStyle = JELLY.tentacle;
    for (var t = 0; t < 7; t++) {
      var f = (t / 6) - 0.5;
      var sx = f * bw * 1.5;
      var len = r * (1.9 + (0.5 - Math.abs(f)) * 1.1);
      ctx.lineWidth = Math.max(1, r * 0.055);
      ctx.beginPath();
      ctx.moveTo(sx, bh * 0.2);
      ctx.bezierCurveTo(
        sx + Math.sin(d.wig * 1.4 + t) * r * 0.26 + dragX * 0.35,
        bh * 0.2 + len * 0.4 + dragY * 0.3,
        sx - Math.sin(d.wig * 1.1 + t * 1.3) * r * 0.3 + dragX * 0.75,
        bh * 0.2 + len * 0.74 + dragY * 0.7,
        sx + Math.sin(d.wig + t * 0.7) * r * 0.24 + dragX,
        bh * 0.2 + len + dragY
      );
      ctx.stroke();
    }

    ctx.strokeStyle = JELLY.arm;
    ctx.lineWidth = Math.max(1.5, r * 0.15);
    for (var a = 0; a < 4; a++) {
      var af = (a / 3) - 0.5;
      var ax = af * bw * 0.78;
      var alen = r * (1.0 + (0.5 - Math.abs(af)) * 0.5);
      ctx.beginPath();
      ctx.moveTo(ax, bh * 0.18);
      ctx.quadraticCurveTo(
        ax + Math.sin(d.wig * 1.2 + a * 1.5) * r * 0.2 + dragX * 0.4,
        bh * 0.18 + alen * 0.6 + dragY * 0.4,
        ax + Math.sin(d.wig + a) * r * 0.16 + dragX * 0.7,
        bh * 0.18 + alen + dragY * 0.6
      );
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.moveTo(-bw, 0);
    ctx.bezierCurveTo(-bw * 1.02, -bh * 1.62, bw * 1.02, -bh * 1.62, bw, 0);
    var lobes = 4;
    for (var k = 0; k < lobes; k++) {
      var x0 = bw - (2 * bw) * (k / lobes);
      var x1 = bw - (2 * bw) * ((k + 1) / lobes);
      ctx.quadraticCurveTo((x0 + x1) / 2, bh * 0.4, x1, 0);
    }
    ctx.closePath();
    var bgr = ctx.createLinearGradient(0, -bh * 1.5, 0, bh * 0.4);
    bgr.addColorStop(0, JELLY.bellTop);
    bgr.addColorStop(0.55, JELLY.bellMid);
    bgr.addColorStop(1, JELLY.bellLow);
    ctx.fillStyle = bgr;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-bw * 0.92, -bh * 0.12);
    ctx.bezierCurveTo(-bw * 0.94, -bh * 1.5, bw * 0.94, -bh * 1.5, bw * 0.92, -bh * 0.12);
    ctx.strokeStyle = JELLY.rim;
    ctx.lineWidth = Math.max(1, r * 0.075);
    ctx.stroke();

    ctx.globalAlpha = 0.5;
    ctx.fillStyle = JELLY.rim;
    for (var g = 0; g < 3; g++) {
      ctx.beginPath();
      ctx.ellipse((g - 1) * bw * 0.4, -bh * 0.52, bw * 0.15, bh * 0.3, 0, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  function drawSquidShape(px, py, ang, s, alpha, wig, speed, c) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(px, py);
    ctx.rotate(ang);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    /* Ten legs, every one the same length, fanned out behind the mantle. */
    var LEGS = 10;
    var legLen = s * 1.02 * (1 - speed * 0.14);
    for (var i = 0; i < LEGS; i++) {
      var t = (i / (LEGS - 1)) - 0.5;
      var baseY = t * s * 1.14;
      var baseX = -s * (0.52 - Math.abs(t) * 0.2);
      var dir = Math.PI - t * 1.38;
      var dcos = Math.cos(dir), dsin = Math.sin(dir);
      var swing = Math.sin(wig + i * 0.66) * s * 0.13;
      ctx.beginPath();
      ctx.moveTo(baseX, baseY);
      ctx.quadraticCurveTo(
        baseX + dcos * legLen * 0.5 - dsin * swing,
        baseY + dsin * legLen * 0.5 + dcos * swing,
        baseX + dcos * legLen,
        baseY + dsin * legLen
      );
      ctx.lineWidth = s * 0.155;
      ctx.strokeStyle = (i === 0 || i === LEGS - 1) ? c.arm : c.armInner;
      ctx.stroke();
    }

    /* The wide flat fin cap that sits over the point of the mantle. */
    ctx.beginPath();
    ctx.moveTo(s * 1.28, 0);
    ctx.quadraticCurveTo(s * 0.96, -s * 0.72, s * 0.34, -s * 1.1);
    ctx.lineTo(s * 0.14, -s * 0.74);
    ctx.lineTo(s * 0.14, s * 0.74);
    ctx.lineTo(s * 0.34, s * 1.1);
    ctx.quadraticCurveTo(s * 0.96, s * 0.72, s * 1.28, 0);
    ctx.closePath();
    var fg = ctx.createLinearGradient(s * 1.2, 0, s * 0.3, 0);
    fg.addColorStop(0, c.finLip);
    fg.addColorStop(1, c.fin);
    ctx.fillStyle = fg;
    ctx.fill();

    /* Rounded plush mantle. */
    ctx.beginPath();
    ctx.moveTo(s * 0.95, 0);
    ctx.bezierCurveTo(s * 0.9, -s * 0.64, s * 0.3, -s * 0.92, -s * 0.2, -s * 0.86);
    ctx.bezierCurveTo(-s * 0.74, -s * 0.8, -s * 0.88, -s * 0.36, -s * 0.88, 0);
    ctx.bezierCurveTo(-s * 0.88, s * 0.36, -s * 0.74, s * 0.8, -s * 0.2, s * 0.86);
    ctx.bezierCurveTo(s * 0.3, s * 0.92, s * 0.9, s * 0.64, s * 0.95, 0);
    ctx.closePath();
    var mg = ctx.createLinearGradient(0, -s * 0.9, 0, s * 0.9);
    mg.addColorStop(0, c.bodyTop);
    mg.addColorStop(0.5, c.bodyMid);
    mg.addColorStop(1, c.bodyLow);
    ctx.fillStyle = mg;
    ctx.fill();

    /* Pale tummy patch. */
    ctx.save();
    ctx.globalAlpha = alpha * 0.85;
    ctx.beginPath();
    ctx.ellipse(-s * 0.36, 0, s * 0.31, s * 0.44, 0, 0, TAU);
    ctx.fillStyle = c.belly;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha * 0.2;
    ctx.beginPath();
    ctx.ellipse(s * 0.42, -s * 0.38, s * 0.3, s * 0.13, -0.22, 0, TAU);
    ctx.fillStyle = "#FFFFFF";
    ctx.fill();
    ctx.restore();

    /* Cheeks. */
    ctx.save();
    ctx.globalAlpha = alpha * 0.42;
    ctx.fillStyle = c.blush;
    for (var b = 0; b < 2; b++) {
      ctx.beginPath();
      ctx.ellipse(s * 0.03, (b === 0 ? -1 : 1) * s * 0.53, s * 0.1, s * 0.13, 0, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    /* Small felt-black eyes with a catchlight, and a little smile. */
    for (var e = 0; e < 2; e++) {
      var sgn = (e === 0 ? -1 : 1);
      var ey = sgn * s * 0.3;
      ctx.beginPath();
      ctx.ellipse(s * 0.24, ey, s * 0.085, s * 0.105, 0, 0, TAU);
      ctx.fillStyle = c.ink;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(s * 0.275, ey - sgn * s * 0.03, s * 0.032, 0, TAU);
      ctx.fillStyle = "rgba(255,255,255,0.92)";
      ctx.fill();
    }
    ctx.beginPath();
    ctx.moveTo(s * 0.19, -s * 0.1);
    ctx.quadraticCurveTo(s * 0.08, 0, s * 0.19, s * 0.1);
    ctx.strokeStyle = c.ink;
    ctx.lineWidth = s * 0.05;
    ctx.stroke();

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawSparks() {
    for (var i = 0; i < sparks.length; i++) {
      var sp = sparks[i];
      var k = 1 - sp.age / sp.life;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, sp.r * (0.5 + k), 0, TAU);
      ctx.fillStyle = "rgba(" + sp.c + "," + (k * 0.9) + ")";
      ctx.fill();
    }
  }

  function render() {
    drawBackground();
    if (state === "playing" || state === "over") {
      for (var i = 0; i < foods.length; i++) drawFood(foods[i]);
      if (shrimp) drawShrimp();
      drawJellies();
      if (manowar) drawManowar();
      for (var k = 0; k < sharks.length; k++) {
        if (sharks[k].phase !== "wait") drawShark(sharks[k]);
      }
      drawSquid();
    }
    drawSparks();
  }

  /* ---------- loop ---------- */

  var last = 0;
  function frame(ts) {
    if (!last) last = ts;
    var dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  function boot(saved) {
    best = (saved && typeof saved.best === "number") ? saved.best : loadBest();
    resize();
    reset();
    state = "title";
    titleVeil.hidden = false;
    overVeil.hidden = true;
    requestAnimationFrame(frame);
  }

  try {
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
      window.claude.hot.snapshot(function () { return { best: best }; });
    }
  } catch (e) {}

  if (window.claude && window.claude.hot && window.claude.hot.ready) {
    window.claude.hot.ready(boot);
  } else {
    boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
  }
})();
</script>
</body>
</html>
